name: Build & Publish NS8 OCI Images

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BUILDAH_ISOLATION: chroot

jobs:
  build-images:
    name: Build mail-toolbox & mail-toolbox-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            app/frontend/package-lock.json
            ui/package-lock.json

      - name: Build Secretariat Web Portal
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Build NS8 Cockpit UI
        working-directory: ui
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run lint
          npm run build
          test -f dist/index.html

      - name: Configure Ubuntu runner for Buildah
        run: |
          if ! command -v buildah >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y buildah
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo aa-teardown || sudo systemctl stop apparmor || true

      - name: Determine image metadata
        id: meta
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            imagetag="${GITHUB_REF_NAME#v}"
            imagetags="${imagetag} latest"
          else
            imagetag="latest"
            branch_tag="$(echo "${GITHUB_REF_NAME:-main}" | tr -cd 'a-zA-Z0-9._-')"
            imagetags="latest ${branch_tag}"
          fi
          echo "repobase=${REGISTRY}/${owner_lc}" >> "${GITHUB_OUTPUT}"
          echo "imagetag=${imagetag}" >> "${GITHUB_OUTPUT}"
          echo "imagetags=${imagetags}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo buildah login --authfile /tmp/containers-auth.json -u "${{ github.actor }}" --password-stdin "${REGISTRY}"

      - name: Build and push OCI images via Buildah
        run: |
          set -o pipefail
          if ! sudo env \
            CI="true" \
            SKIP_UI_BUILD="1" \
            BUILDAH_ISOLATION="chroot" \
            REGISTRY_AUTH_FILE="/tmp/containers-auth.json" \
            REPOBASE="${{ steps.meta.outputs.repobase }}" \
            IMAGETAG="${{ steps.meta.outputs.imagetag }}" \
            IMAGETAGS="${{ steps.meta.outputs.imagetags }}" \
            PUBLISH_IMAGES="${{ github.event_name != 'pull_request' && '1' || '0' }}" \
            GITHUB_OUTPUT="${GITHUB_OUTPUT}" \
            bash build-images.sh 2>&1 | tee /tmp/buildah.log; then
            echo "::error title=Buildah Failure::$(tail -n 30 /tmp/buildah.log | tr '\n' ' ')"
            exit 1
          fi
          sudo chown "${USER}:${USER}" "${GITHUB_OUTPUT}" || true
